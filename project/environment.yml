name: project-env
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pytorch::pytorch
  - pytorch::torchvision
  - pip
  - pip:
    - transformers
    - datasets
    - scikit-learn
    - pandas
    - numpy
    - requests
    - matplotlib
    - ipykernel
    - jupyter
# Note: if you need CUDA-enabled PyTorch, install the appropriate 'pytorch-cuda' package
# using the 'pytorch' and 'nvidia' channels or follow https://pytorch.org/get-started/locally/
